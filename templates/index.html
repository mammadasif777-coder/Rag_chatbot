<!doctype html>
<html>
<head>
  <title>PDF Chatbot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-5">
  <h3>PDF Chatbot</h3>
  <input type="file" id="pdf" class="form-control my-3">
  <button class="btn btn-secondary mb-4" onclick="upload()">Upload PDF</button>
  <input id="q" class="form-control" placeholder="Ask a question...">
  <button class="btn btn-primary my-3" onclick="ask()">Ask</button>
  <div id="out" class="alert alert-light"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script>
    async function upload() {
      const form = new FormData();
      form.append("pdf", document.getElementById("pdf").files[0]);
      const r = await fetch("/upload", { method: "POST", body: form });
      document.getElementById("out").innerText = (await r.json()).message;
    }
    async function ask() {
      const r = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: document.getElementById("q").value })
      });
      const data = await r.json();
      document.getElementById("out").innerHTML = DOMPurify.sanitize(marked.parse(data.answer));
    }
  </script>
</body>
</html>
